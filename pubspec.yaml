name: drinking
description: 喝水小精灵 - 治愈奶油风喝水提醒
publish_to: 'none'
version: 2.0.4+11

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  provider: ^6.1.2

  # 本地存储
  shared_preferences: ^2.2.3

  # 通知
  flutter_local_notifications: ^17.2.1

  # 后台定时保活
  android_alarm_manager_plus: ^5.1.1

  # 权限处理
  permission_handler: ^11.3.1

  # 网络请求(飞书 API)
  http: ^1.2.1

  # WebView(飞书 OAuth 内嵌授权)
  webview_flutter: ^4.8.0

  # URL 启动(唤起飞书 App 处理 lark:// scheme)
  url_launcher: ^6.3.0

  # 图片选择(相机/相册)
  image_picker: ^1.0.4

  # 日历管理(批量添加/删除日历事件)
  device_calendar: ^4.3.3

  # 系统闹钟 intent(添加闹钟到手机时钟App)
  android_intent_plus: ^5.0.2

  # 时区数据(device_calendar v4 依赖,需显式声明)
  timezone: ^0.9.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
